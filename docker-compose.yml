services:
  postgres:
    image: postgres:latest
    container_name: lexicon_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - lexicon_postgres_data:/var/lib/postgresql/data

volumes:
  lexicon_postgres_data:
